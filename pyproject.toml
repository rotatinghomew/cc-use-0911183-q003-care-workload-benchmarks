[project]
name = "care-workload-benchmarks"
version = "0.1.0"
description = "共同照护与等级重评下的耗时基准及绩效解释的业务数据服务"
requires-python = ">=3.11"
dependencies = ["numpy==2.2.6", "scipy==1.15.3"]

[build-system]
requires = ["setuptools==75.8.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["workload"]

[tool.unittest]
start-directory = "tests"
